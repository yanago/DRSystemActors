# Create this secret before applying other manifests (see docs/CONTAINERIZATION.md).
# Example (replace with your values):
#   kubectl create secret generic replay-db-secret \
#     --from-literal=username=replay \
#     --from-literal=password=changeme
#
# Or apply this file after replacing placeholder base64 (username: replay, password: changeme):
#   echo -n 'replay' | base64   -> cmVwbGF5
#   echo -n 'changeme' | base64 -> Y2hhbmdlbWU=
apiVersion: v1
kind: Secret
metadata:
  name: replay-db-secret
type: Opaque
stringData:
  username: replay
  password: changeme
---
# JDBC URL and credentials for the API server (optional if using same DB secret)
apiVersion: v1
kind: Secret
metadata:
  name: replay-api-secret
type: Opaque
stringData:
  REPLAY_JDBC_URL: "jdbc:postgresql://postgres:5432/replay"
  REPLAY_JDBC_USER: "replay"
  REPLAY_JDBC_PASSWORD: "changeme"
