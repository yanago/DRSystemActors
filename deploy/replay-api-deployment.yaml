apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-api
  labels:
    app: replay-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay-api
  template:
    metadata:
      labels:
        app: replay-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
      containers:
        - name: replay-api
          image: replay-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: replay-api-secret
          env:
            - name: REPLAY_JDBC_CONNECT_RETRIES
              value: "20"
            - name: REPLAY_JDBC_CONNECT_DELAY_MS
              value: "2000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: replay-api
  labels:
    app: replay-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: replay-api
