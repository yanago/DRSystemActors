apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-api
  labels:
    app: replay-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay-api
  template:
    metadata:
      labels:
        app: replay-api
    spec:
      containers:
        - name: replay-api
          image: replay-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: replay-api-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: replay-api
  labels:
    app: replay-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: replay-api
